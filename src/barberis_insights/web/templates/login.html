{% extends "base.html" %}
{% block content %}
<div class="loginbox">
  <div class="brand">BARBERIS<small>{{ t("app.tagline") }}</small></div>
  <h1>{{ t("auth.login_title") }}</h1>
  {% if error %}<p class="flash warn" role="alert">{{ t("auth.login_failed") }}</p>{% endif %}
  <form method="post" action="/login" class="note-f" style="border:0;padding:0">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ t("auth.username") }}<input name="username" autocomplete="username" required autofocus></label>
    <label>{{ t("auth.password") }}<input name="password" type="password" autocomplete="current-password" required></label>
    <div><button>{{ t("auth.login") }}</button></div>
  </form>
</div>
{% endblock %}
