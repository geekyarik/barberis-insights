[project]
name = "barberis-insights"
version = "0.1.0"
description = "Local analytics, goals and client win-back service for BARBERIS barbershop"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "pandas>=2.2",
  "scipy>=1.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "mcp>=2.2",
  "gspread>=6.1",
  "google-auth-oauthlib>=1.2",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.2",
]

[project.scripts]
insights = "barberis_insights.cli:app"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barberis_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
